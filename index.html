    gap:8px 24px;

    background:var(--paper);
  }

  .name{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:1.5rem;

  }
  .name::before{

    display:block;
    font-size:0.68rem;
    font-weight:500;
    letter-spacing:0.12em;
    text-transform:uppercase;

    margin-bottom:4px;
  }

    font-size:0.9rem;
    color:var(--ink-soft);
    margin-top:4px;
  }

    gap:20px;
    font-family:'Inter', sans-serif;
    font-size:0.85rem;
  }

  }

  }

    display:grid;
    grid-template-columns:230px 1fr;
    min-height:calc(100vh - 97px);
  }

    background:var(--navy-panel);
    color:#C9D2DE;
    padding:28px 0;
    border-right:2px solid var(--ink);
    overflow:hidden;
  }

    list-style:none;
    margin:0;
    padding:0;
  }
  .sidebar li{ margin:0; }
  .sidebar button{
    all:unset;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    padding:12px 24px;
    font-family:'Inter', sans-serif;
    font-size:0.92rem;
    color:#C9D2DE;
    cursor:pointer;
    border-left:3px solid transparent;
    transition:background .12s ease, border-color .12s ease, color .12s ease;
  }
  .sidebar button::before{
    content:"›";
    color:#4C5F80;
    font-weight:700;
    transition:color .12s ease;
  }
  .sidebar button:hover{
    background:rgba(255,255,255,0.04);
    color:#fff;
  }
  .sidebar button:focus-visible{

  }

  @keyframes fadeIn{

  }
</style>

    const tags = item.tags ? `<div class="tags">${item.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>` : '';
    const image = item.img ? `<img src="${item.img}" alt="${item.title}" class="card-img">` : '';
    const linkIcon = item.link ? `<a class="link-icon" href="${item.link}" target="_blank" rel="noopener" aria-label="Open link for ${item.title}" title="Open link">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      </a>` : '';
    const orgLogo = item.org ? `<span class="org-logo" style="background:${orgColors[item.org] || 'var(--teal)'}">${item.org.charAt(0)}</span>` : '';

    return `
      <article class="card${statusClass}">
        <div class="card-top">
          ${orgLogo}
          <div class="card-top-text">
            <h3>${item.title}${linkIcon}</h3>
            <span class="meta">${item.meta}</span>
          </div>
        </div>
        ${badge}
        ${image}
        ${body}
        ${tags}
      </article>
    `;
  }

  let bodyHtml;
  if(section.groups){
    bodyHtml = section.groups.map(group => `
      <h2 class="group-heading">${group.label}</h2>
      <div class="card-grid">${group.items.map(cardHtml).join('')}</div>
    `).join('');
  } else {
    bodyHtml = `<div class="card-grid">${section.items.map(cardHtml).join('')}</div>`;
  }

  main.innerHTML = `
    <h1 class="section-title">${section.title}</h1>
    ${section.sub ? `<p class="section-sub">${section.sub}</p>` : ''}
    <div class="fade">${bodyHtml}</div>
  `;
}

buttons.forEach(btn => {
  btn.addEventListener('click', () => render(btn.dataset.section));
});

render('projects');
</script>

</body>
</html>
